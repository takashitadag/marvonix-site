<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Administrace obsahu | Marvonix</title>
<meta name="theme-color" content="#060818"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://api.web3forms.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"/>
<style>
:root{--bg:#060818;--bg2:#0d1230;--purple:#a855f7;--purple2:#c084fc;--text:#fff;--muted:rgba(255,255,255,.72);--line:rgba(255,255,255,.12);--danger:#ef4444;--ok:#22c55e;--r:22px;--max:1120px;--pad:20px}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(900px 620px at 12% 8%,rgba(168,85,247,.18),transparent 58%),linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial}.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--pad)}a{color:inherit;text-decoration:none}.top{border-bottom:1px solid var(--line);background:rgba(5,7,20,.36);backdrop-filter:blur(16px)}.topin{min-height:86px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{font-weight:950;letter-spacing:.16em;text-transform:uppercase}.nav{display:flex;gap:10px;flex-wrap:wrap}.btn,button{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:999px;padding:12px 18px;background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff;font-weight:900;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.btn.secondary,button.secondary{background:rgba(255,255,255,.08);border:1px solid var(--line)}button.danger{background:rgba(239,68,68,.92)}main{padding:56px 0 80px}.panel{border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.04));box-shadow:0 20px 70px rgba(0,0,0,.32);padding:28px;margin-bottom:24px}h1{font-size:clamp(34px,6vw,72px);line-height:.98;margin:0 0 14px;letter-spacing:-.05em}h2{font-size:30px;margin:0 0 18px}.muted{color:var(--muted);line-height:1.7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:grid;gap:8px;margin-bottom:14px}label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:900;color:rgba(255,255,255,.86)}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.06);color:#fff;padding:14px 14px;font:inherit;outline:none}textarea{min-height:140px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:rgba(192,132,252,.55);box-shadow:0 0 0 4px rgba(168,85,247,.13)}.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.message{display:none;margin:14px 0 0;padding:14px 16px;border-radius:16px;border:1px solid var(--line);color:#fff}.message.show{display:block}.message.err{border-color:rgba(239,68,68,.45);background:rgba(239,68,68,.12)}.message.ok{border-color:rgba(34,197,94,.45);background:rgba(34,197,94,.12)}.items{display:grid;gap:14px}.item{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.045);padding:18px}.item h3{margin:0 0 6px;font-size:22px}.tag{display:inline-flex;margin-bottom:8px;border:1px solid rgba(192,132,252,.28);background:rgba(168,85,247,.12);padding:6px 10px;border-radius:999px;color:#fff;font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.switch{display:flex;gap:9px;align-items:center;margin:10px 0}.switch input{width:22px;height:22px}.empty{padding:24px;border:1px dashed var(--line);border-radius:18px;color:var(--muted);text-align:center}@media(max-width:760px){.grid{grid-template-columns:1fr}.topin,.item{grid-template-columns:1fr;display:grid}.nav{justify-content:flex-start}.actions button,.actions a{width:100%}}
</style>
</head>
<body>
<header class="top"><div class="wrap topin"><a class="brand" href="index.html">Marvonix</a><nav class="nav"><a class="btn secondary" href="index.html">Web</a><a class="btn secondary" href="reference.html">Reference</a><a class="btn secondary" href="tym.html">Tým</a><a class="btn secondary" href="audity.html">Audity</a></nav></div></header>
<main class="wrap">
<section class="panel" id="loginPanel"><h1>Administrace obsahu</h1><p class="muted">Správa týmu, klientských referencí a referencí k auditům. Stránka je skrytá před vyhledávači.</p><div class="field"><label for="password">Heslo</label><input id="password" type="password" autocomplete="current-password"/></div><div class="actions"><button id="loginBtn" type="button">Přihlásit</button></div><div class="message err" id="loginMessage"></div></section>
<section class="panel" id="adminPanel" hidden><div class="actions" style="justify-content:space-between;margin-bottom:18px"><h2>Obsah webu</h2><button class="secondary" id="logoutBtn" type="button">Odhlásit</button></div><form id="contentForm"><input type="hidden" id="itemId"/><div class="grid"><div class="field"><label for="type">Typ obsahu</label><select id="type"><option value="references">Reference klientů</option><option value="audit_references">Reference k auditům</option><option value="team">Člen týmu</option></select></div><div class="field"><label for="sort_order">Pořadí</label><input id="sort_order" type="number" value="0"/></div></div><div class="grid"><div class="field"><label for="title">Název / jméno</label><input id="title" required placeholder="Daniela K. / Martin / Audit pro lokální firmu"/></div><div class="field"><label for="role">Role / pozice</label><input id="role" placeholder="CEO / Klient / Majitel firmy"/></div></div><div class="grid"><div class="field"><label for="subtitle">Lokalita / krátký popis</label><input id="subtitle" placeholder="Olomouc / marketingový audit / web"/></div><div class="field"><label for="tag">Štítek</label><input id="tag" placeholder="Doporučuji / Web / Audit"/></div></div><div class="grid"><div class="field"><label for="score">Skóre auditu</label><input id="score" type="number" min="0" max="100" placeholder="např. 84"/></div><div class="field"><label for="external_url">Odkaz</label><input id="external_url" type="url" placeholder="https://..."/></div></div><div class="field"><label for="image_url">URL obrázku</label><input id="image_url" type="url" placeholder="https://..."/></div><div class="field"><label for="body">Text</label><textarea id="body" required placeholder="Hlavní text reference nebo popis člena týmu..."></textarea></div><label class="switch"><input id="visible" type="checkbox" checked/> Zobrazit na webu</label><div class="actions"><button id="saveBtn" type="submit">Uložit</button><button class="secondary" id="newBtn" type="button">Nový záznam</button></div><div class="message" id="formMessage"></div></form></section>
<section class="panel" id="listPanel" hidden><h2>Uložený obsah</h2><div class="items" id="items"></div></section>
</main>
<footer class="wrap" style="padding:0 20px 34px;color:rgba(255,255,255,.62);font-size:13px;line-height:1.7">
Marvonix administrace obsahu · <a href="index.html">Zpět na web</a> · <a href="pravni-informace.html">Právní informace</a>
</footer>
<script>
const state={password:sessionStorage.getItem('marvonixAdminPassword')||'',items:[]};
const $=id=>document.getElementById(id);
const fields=['itemId','type','title','role','subtitle','tag','score','external_url','image_url','body','visible','sort_order'];
function msg(el,text,type='err'){el.textContent=text;el.className='message show '+type;}
function clearMsg(el){el.textContent='';el.className='message';}
async function api(method='GET',payload=null){
  const options={method,headers:{'Content-Type':'application/json','x-admin-password':state.password}};
  if(payload) options.body=JSON.stringify(payload);
  const url=method==='GET'?'/api/marvonix-data?admin=1':'/api/marvonix-data';
  const res=await fetch(url,options);const data=await res.json().catch(()=>({ok:false,message:'Neplatná odpověď serveru.'}));
  if(!res.ok||!data.ok) throw new Error(data.message||'Požadavek selhal.');return data;
}
function showAdmin(){ $('loginPanel').hidden=true; $('adminPanel').hidden=false; $('listPanel').hidden=false; }
function showLogin(){ $('loginPanel').hidden=false; $('adminPanel').hidden=true; $('listPanel').hidden=true; }
function formData(){ return {id:$('itemId').value,type:$('type').value,title:$('title').value,role:$('role').value,subtitle:$('subtitle').value,tag:$('tag').value,score:$('score').value,external_url:$('external_url').value,image_url:$('image_url').value,body:$('body').value,visible:$('visible').checked,sort_order:$('sort_order').value}; }
function resetForm(){ $('contentForm').reset(); $('itemId').value=''; $('visible').checked=true; $('sort_order').value='0'; clearMsg($('formMessage')); }
function fillForm(item){ $('itemId').value=item.id; $('type').value=item.type; $('title').value=item.title||''; $('role').value=item.role||''; $('subtitle').value=item.subtitle||''; $('tag').value=item.tag||''; $('score').value=item.score??''; $('external_url').value=item.external_url||''; $('image_url').value=item.image_url||''; $('body').value=item.body||''; $('visible').checked=!!item.visible; $('sort_order').value=item.sort_order||0; window.scrollTo({top:0,behavior:'smooth'}); }
function labelType(t){return {team:'Tým',references:'Reference klientů',audit_references:'Reference k auditům'}[t]||t;}
function render(){
  const box=$('items');
  if(!state.items.length){box.innerHTML='<div class="empty">Zatím není uložený žádný obsah.</div>';return;}
  box.innerHTML=state.items.map(item=>`<article class="item"><div><span class="tag">${labelType(item.type)}${item.visible?'':' • skryto'}</span><h3>${esc(item.title)}</h3><p class="muted">${esc(item.role||item.subtitle||'')}</p><p class="muted">${esc((item.body||'').slice(0,220))}${(item.body||'').length>220?'…':''}</p></div><div class="actions"><button type="button" onclick="editItem('${item.id}')">Upravit</button><button class="danger" type="button" onclick="deleteItem('${item.id}')">Smazat</button></div></article>`).join('');
}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
async function load(){const data=await api('GET');state.items=data.items||[];render();}
window.editItem=id=>{const item=state.items.find(i=>String(i.id)===String(id));if(item) fillForm(item);};
window.deleteItem=async id=>{if(!confirm('Opravdu smazat záznam?'))return;await api('DELETE',{id});await load();resetForm();};
$('loginBtn').addEventListener('click',async()=>{state.password=$('password').value.trim();try{await load();sessionStorage.setItem('marvonixAdminPassword',state.password);showAdmin();}catch(e){msg($('loginMessage'),e.message);}});
$('logoutBtn').addEventListener('click',()=>{sessionStorage.removeItem('marvonixAdminPassword');state.password='';showLogin();});
$('newBtn').addEventListener('click',resetForm);
$('contentForm').addEventListener('submit',async e=>{e.preventDefault();clearMsg($('formMessage'));try{const data=formData();await api(data.id?'PUT':'POST',data);msg($('formMessage'),'Uloženo.','ok');await load();resetForm();}catch(err){msg($('formMessage'),err.message);}});
if(state.password){load().then(showAdmin).catch(()=>{sessionStorage.removeItem('marvonixAdminPassword');showLogin();});}
</script>
</body>
</html>
